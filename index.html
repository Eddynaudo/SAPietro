<!doctype html>
<html lang="it">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DayMarck · Promemoria che non dimentichi</title>
<meta name="description" content="DayMarck: l'app di promemoria con notifiche che confermi. Pagamento Lifetime una tantum.">
<meta name="theme-color" content="#0b1636">
<link rel="icon" href="app/favicon-32.png">
<link rel="apple-touch-icon" href="app/icon-180.png">
<style>
*{box-sizing:border-box}
html{background:#0b1636}
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#17203a;background:#0b1636 url(app/bg.webp) center top/cover fixed no-repeat;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:rgba(6,11,32,.5);z-index:-1}
.wrap{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:flex-end;gap:8px}.top .lg{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none}
.top button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.hero{text-align:center;color:#fff;padding:18px 0 8px}
.hero img{width:104px;height:104px;filter:drop-shadow(0 6px 20px rgba(40,150,255,.6))}
.hero h1{margin:8px 0 6px;font-size:clamp(32px,9vw,48px);line-height:1.05;letter-spacing:-.02em}
.hero p{margin:0 auto 18px;max-width:520px;font-size:18px;opacity:.95}
.cta{display:inline-block;border:0;border-radius:14px;background:#2F5BFF;color:#fff;font:800 20px inherit;font-family:inherit;padding:16px 38px;cursor:pointer;box-shadow:0 8px 26px rgba(47,91,255,.55)}
.ctp{margin:12px auto 0!important;font-size:15px!important;font-weight:700;opacity:1!important;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 12px rgba(0,0,0,.5)}.cts{margin:4px auto 0!important;font-size:14px!important;opacity:1!important;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 12px rgba(0,0,0,.5)}
.card{background:rgba(255,255,255,.97);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h2{margin:0 0 8px;font-size:20px;color:#0b1636}
ul{margin:6px 0;padding-left:20px}li{margin:4px 0}
.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;position:relative;padding-left:40px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#2F5BFF;color:#fff;text-align:center;line-height:28px;font-weight:800}
.big{font-size:22px;font-weight:800;color:#2F5BFF}
.rfc{padding:0;overflow:hidden}
.rfh{display:flex;gap:14px;align-items:center;padding:20px;background:linear-gradient(135deg,#2F5BFF,#6a3df0);color:#fff}
.rfh h2{color:#fff;margin:0 0 2px;font-size:22px}.rfp{margin:0;opacity:.92;font-size:15px}
.rfi{font-size:34px;line-height:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px}
.rfr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 20px 0;padding:16px;border-radius:14px;background:#eef3ff;border:1px solid #d5e0ff}
.rfa{display:flex;flex-direction:column;align-items:center;min-width:104px}.rfa b{white-space:nowrap;font-size:40px;line-height:1;color:#2F5BFF;letter-spacing:-.02em}.rfa span{font-size:13px;font-weight:700;color:#4a5578;margin-top:4px;text-align:center}
.rfd{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;flex:1;min-width:200px}
.rfd i{aspect-ratio:1;border-radius:50%;background:#2F5BFF;opacity:.9;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:12px}
.rfd i.g{background:#ffb703;opacity:1}
.rfc .steps{margin:8px 20px 0}.rfc .steps li{margin:14px 0}
.rfb{margin:6px 20px 0;padding:12px 14px;border-radius:12px;background:#0b1636;color:#fff;font-weight:700;font-size:15px}
.rfn{margin:12px 20px 20px;font-size:14px;color:#4a5578}
@media(max-width:480px){.rfa{flex-direction:row;gap:12px;min-width:0;width:100%}.rfa span{text-align:left;margin:0}.rfd{min-width:100%}.rfr{gap:12px}}
form{display:grid;gap:10px;margin-top:10px}
.fl{font-weight:700;margin:2px 0 -4px}.why{color:#4a5578;font-size:13px;line-height:1.4;margin:-4px 0 2px}input[type=email],input[type=text]{width:100%;padding:13px 12px;border-radius:10px;border:1px solid #c6cde0;font:inherit;font-size:16px}
.hp{position:absolute;left:-9999px;opacity:0}
form button{border:0;border-radius:12px;background:#2F5BFF;color:#fff;font:800 17px inherit;font-family:inherit;padding:14px;cursor:pointer}
form button:disabled{opacity:.6}
.msg{margin-top:10px;font-weight:600}.msg.ok{color:#127a3a}.msg.er{color:#b3261e}
.ref{background:#eef3ff;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
footer{text-align:center;color:#fff;opacity:.85;font-size:13px;margin-top:18px}footer a{color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="lg" href="app/" data-i="login"></a><button id="lang" type="button">EN</button></div>
  <header class="hero">
    <img src="app/icon-512.png" alt="DayMarck">
    <h1>DayMarck</h1>
    <p data-i="sub"></p>
    <button class="cta" id="go" type="button" data-i="cta"></button>
    <p class="ctp" data-i="ctp"></p>
    <p class="cts" data-i="cts"></p>
  </header>

  <section class="card">
    <h2 data-i="whT"></h2>
    <ul data-i="whL"></ul>
  </section>

  <section class="card">
    <h2 data-i="hwT"></h2>
    <ol class="steps" data-i="hwS"></ol>
  </section>

  <section class="card rfc">
    <div class="rfh"><span class="rfi" aria-hidden="true">🎁</span><div><h2 data-i="rfT"></h2><p class="rfp" data-i="rfP"></p></div></div>
    <div class="rfr">
      <div class="rfa"><b>10 €</b><span data-i="rfL"></span></div>
      <div class="rfd" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="g">🎁</i></div>
    </div>
    <p class="rfb" data-i="rfB"></p>
    <p class="rfn" data-i="rfN"></p>
  </section>

  <section class="card" id="dl">
    <h2 data-i="dlT"></h2>
    <p data-i="dlP"></p>
    <form id="f" novalidate>
      <label for="n" class="fl" data-i="lbN"></label>
      <input type="text" id="n" autocomplete="name" maxlength="80" required data-ph="phN">
      <small class="why" data-i="whyN"></small>
      <label for="e" class="fl" data-i="lbE"></label>
      <input type="email" id="e" autocomplete="email" inputmode="email" maxlength="254" required data-ph="phE">
      <input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="ref" id="rf" hidden></div>
      <button type="submit" id="sb" data-i="dlB"></button>
    </form>
    <p class="msg" id="m" role="status"></p>
  </section>

  <section class="card">
    <h2 data-i="inT"></h2>
    <p data-i="inP"></p>
  </section>

  <footer><a href="app/privacy.html" data-i="pv"></a> · <a href="app/termini.html" data-i="tm"></a><br>© 2026 DayMarck · MBL &amp; MBLab · <span data-i="rr"></span></footer>
</div>
<script>
const API='https://jhupjstzpwmpvkntxosd.supabase.co/functions/v1/access-request';
const TX={
it:{login:'Accedi all’app',sub:'I promemoria che non dimentichi: la notifica arriva, tu confermi, e la cosa è fatta.',cta:'ACQUISTA DAYMARCK',ctp:'9,89 € una tantum · Accesso Lifetime · Nessun abbonamento',cts:'Inserisci i tuoi dati per ricevere automaticamente via email il link di pagamento.',
whT:'A cosa serve',whL:'<li><b>Promemoria che insistono</b> finché non confermi o rimandi: niente più cose dimenticate.</li><li><b>Fino a 5 avvisi</b> per ogni attività, anche prima della scadenza.</li><li><b>Calendario e filtri</b> “Da fare / Fatti” per avere tutto sotto controllo.</li><li><b>Allegati e note</b> collegati a ogni attività.</li><li><b>Face ID / impronta</b> opzionale e assistente integrato per ogni dubbio.</li><li>Si installa sul telefono come un’app, <b>senza store</b>.</li>',
hwT:'Come funziona',hwS:'<li><b>Compila il modulo</b> con nome, cognome ed email.</li><li><b>Ricevi automaticamente l’email</b> e completa il pagamento.</li><li>Dopo la conferma del pagamento ricevi <b>link e codice di attivazione</b> e imposti la tua password.</li><li><b>Installa DayMarck</b> sul telefono e inizia a utilizzarla.</li>',
rfT:'Invita gli amici e ricevi buoni Amazon',rfP:'Dopo l’attivazione trovi nell’app il tuo link personale. Ogni 10 amici che completano un acquisto valido tramite il tuo link, ricevi un buono Amazon da 10 €.',rfL:'buono Amazon ogni 10 amici',
rfS:'',
rfB:'Ogni 10 amici = buono Amazon da 10 €. Senza limiti: 20 amici = 20 €, 30 amici = 30 €…',rfN:'Contano solo gli acquisti validi: clic e semplici registrazioni non valgono. Il buono viene consegnato dopo 15 giorni di verifica degli acquisti, secondo le condizioni del programma. Invitare amici è facoltativo.',
dlT:'Acquista e attiva DayMarck',dlP:'Compila il modulo: riceverai automaticamente via email il link per pagare 9,89 € e acquistare DayMarck. L’invio del modulo non comporta alcun addebito.',phN:'Nome e cognome',phE:'La tua email',dlB:'RICEVI IL LINK DI PAGAMENTO',lbN:'Nome e cognome *',lbE:'Email *',whyN:'Il nome e cognome è obbligatorio: serve per assegnare correttamente i buoni Amazon previsti dal programma referral.',needN:'Inserisci nome e cognome (obbligatorio).',
ref:'Sei stato invitato con il codice',sending:'Invio…',ok:'Ti abbiamo inviato il link di pagamento via email. Controlla anche la cartella spam. Dopo la conferma del pagamento riceverai il link e il codice per attivare DayMarck.',okn:'Abbiamo ricevuto i tuoi dati, ma non possiamo ancora confermarti l’invio dell’email. Controlla la posta (anche lo spam) tra qualche minuto; se non arriva, riprova più tardi o scrivici.',er:'Non sono riuscito a inviare. Riprova tra poco.',bad:'Inserisci un’email valida.',lim:'Troppe richieste. Riprova più tardi.',
inT:'Come si installa',inP:'Dopo aver completato il pagamento e attivato l’account, puoi aggiungere DayMarck alla schermata Home del telefono. Su iPhone apri il link in Safari → Condividi → “Aggiungi alla schermata Home”. Su Android in Chrome → menu ⋮ → “Installa app”.',pv:'Informativa sulla privacy',tm:'Condizioni di acquisto',rr:'Tutti i diritti riservati'},
en:{login:'Open the app',sub:'Reminders you never forget: the alert arrives, you confirm, and it’s done.',cta:'BUY DAYMARCK',ctp:'€9.89 one-time · Lifetime access · No subscription',cts:'Enter your details to automatically receive the payment link by email.',
whT:'What it does',whL:'<li><b>Persistent reminders</b> until you confirm or snooze: no more forgotten things.</li><li><b>Up to 5 alerts</b> per task, also before the deadline.</li><li><b>Calendar and filters</b> “To do / Done” to keep everything under control.</li><li><b>Attachments and notes</b> on every task.</li><li>Optional <b>Face ID / fingerprint</b> and a built-in assistant for any question.</li><li>Installs on your phone like an app, <b>no store needed</b>.</li>',
hwT:'How it works',hwS:'<li><b>Fill in the form</b> with your first name, last name and email.</li><li><b>Receive the email automatically</b> and complete the payment.</li><li>After the payment is confirmed you receive the <b>activation link and code</b> and set your password.</li><li><b>Install DayMarck</b> on your phone and start using it.</li>',
rfT:'Invite friends and get Amazon vouchers',rfP:'After activation you will find your personal link in the app. For every 10 friends who complete a valid purchase through your link, you get a €10 Amazon voucher.',rfL:'Amazon voucher every 10 friends',
rfS:'',
rfB:'Every 10 friends = €10 Amazon voucher. No limit: 20 friends = €20, 30 friends = €30…',rfN:'Only valid purchases count: clicks and sign-ups alone don’t. The voucher is handed over after a 15-day verification of the purchases, according to the program terms. Inviting friends is optional.',
dlT:'Buy and activate DayMarck',dlP:'Fill in the form: you will automatically receive by email the link to pay €9.89 and buy DayMarck. Submitting the form does not charge you anything.',phN:'Full name',phE:'Your email',dlB:'GET THE PAYMENT LINK',lbN:'Full name *',lbE:'Email *',whyN:'Your full name is required: we need it to assign the Amazon vouchers of the referral program correctly.',needN:'Enter your full name (required).',
ref:'You were invited with code',sending:'Sending…',ok:'We have emailed you the payment link. Please check your spam folder too. After the payment is confirmed you will receive the link and the code to activate DayMarck.',okn:'We received your details, but we cannot confirm yet that the email was sent. Check your inbox (and spam) in a few minutes; if it does not arrive, try again later or contact us.',er:'Could not send. Please try again shortly.',bad:'Enter a valid email.',lim:'Too many requests. Try again later.',
inT:'How to install',inP:'After completing the payment and activating your account, you can add DayMarck to your phone’s Home Screen. On iPhone open the link in Safari → Share → “Add to Home Screen”. On Android in Chrome → menu ⋮ → “Install app”.',pv:'Privacy policy',tm:'Terms of purchase',rr:'All rights reserved'}
};
let L=(localStorage.getItem('dm.lang')||(navigator.language||'it').slice(0,2))==='en'?'en':'it';
const $=s=>document.querySelector(s);
let REF='';
try{const r=new URLSearchParams(location.search).get('ref');if(r&&/^[A-Za-z0-9]{4,16}$/.test(r)){REF=r.toUpperCase();sessionStorage.setItem('dm.ref',REF)}else REF=sessionStorage.getItem('dm.ref')||''}catch(e){}
function apply(){
  document.documentElement.lang=L;$('#lang').textContent=L==='en'?'IT':'EN';
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=TX[L][e.dataset.i]});
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=TX[L][e.dataset.ph]});
  const r=$('#rf');r.hidden=!REF;if(REF)r.textContent=TX[L].ref+' '+REF;
}
$('#lang').onclick=()=>{L=L==='en'?'it':'en';try{localStorage.setItem('dm.lang',L)}catch(e){}apply()};
$('#go').onclick=()=>{$('#dl').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#e').focus({preventScroll:true}),500)};
$('#f').onsubmit=async ev=>{
  ev.preventDefault();const m=$('#m'),e=$('#e').value.trim();
  m.className='msg';
  const nm=$('#n').value.trim().replace(/\s+/g,' ');
  if(nm.length<2||!/\p{L}/u.test(nm)){m.className='msg er';m.textContent=TX[L].needN;$('#n').focus();return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){m.className='msg er';m.textContent=TX[L].bad;return}
  $('#sb').disabled=true;m.textContent=TX[L].sending;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,name:nm,ref:REF,lang:L,hp:$('#hp').value})});
    if(r.status===400){const j=await r.json().catch(()=>({}));m.className='msg er';m.textContent=j.error==='name_required'?TX[L].needN:TX[L].bad;$('#sb').disabled=false;return}
    if(r.status===429){m.className='msg er';m.textContent=TX[L].lim;$('#sb').disabled=false;return}
    if(!r.ok)throw 0;
    const j=await r.json().catch(()=>({}));
    m.className='msg ok';m.textContent=j.sent===true?TX[L].ok:TX[L].okn;$('#f').querySelectorAll('input').forEach(i=>i.disabled=true);
  }catch(_){m.className='msg er';m.textContent=TX[L].er;$('#sb').disabled=false}
};
apply();
</script>
</body>
</html>
