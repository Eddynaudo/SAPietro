<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DayMarck</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DayMarck">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--glass:rgba(14,22,46,.68);--glass2:rgba(12,19,40,.92);--ink:#F2F6FF;--mute:#B7C3DC;--line:rgba(255,255,255,.18);--field:rgba(255,255,255,.08);--acc:#7C98FF;--accInk:#0B1230;--warn:#F5A940;--ok:#6FCF97;--bad:#D64545;
  --sky1:#050a1c;--sky2:#0b1636;--sky3:#16224a;--stars:1;--skyInk:#F2F6FF;--skyMute:rgba(242,246,255,.86);--skyShadow:0 1px 10px rgba(0,0,0,.4);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--sky3)}
body{margin:0;color:var(--ink);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* iPhone installato: la barra di stato (ora, batteria) non deve coprire le scritte, anche se il telefono non comunica lo spazio */
@supports (-webkit-touch-callout:none){@media (display-mode:standalone){
  .app{padding-top:max(calc(16px + env(safe-area-inset-top,0px)),64px)}
  .nvw{padding-top:max(calc(12px + env(safe-area-inset-top,0px)),60px)}
  .alerts{top:max(calc(8px + env(safe-area-inset-top,0px)),56px)}
}}
@supports (-webkit-touch-callout:none){html.ios-sa .app{padding-top:max(calc(16px + env(safe-area-inset-top,0px)),64px)}html.ios-sa .nvw{padding-top:max(calc(12px + env(safe-area-inset-top,0px)),60px)}html.ios-sa .alerts{top:max(calc(8px + env(safe-area-inset-top,0px)),56px)}}

/* cielo */
#sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);overflow:hidden}
#sky canvas{position:absolute;inset:0;width:100%;height:100%;opacity:var(--stars)}
#stars2{animation:tw 4.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:var(--stars)}to{opacity:calc(var(--stars)*.25)}}
@media (prefers-reduced-motion:reduce){#stars2{animation:none}.al{animation:none}}

.guest .app,.guest .fab{visibility:hidden}
.app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(28px,7.6vw,42px);line-height:1.04;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em;color:var(--skyInk);text-shadow:var(--skyShadow)}
.sub{color:var(--skyMute);margin:0 0 16px;text-shadow:var(--skyShadow)}
.hb{display:flex;gap:8px}
.ib{border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px;min-width:44px;height:44px;cursor:pointer}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:#F2F6FF;color:#0B1230;border-color:transparent;font-weight:600}
#filters{margin-top:-2px}

/* calendario */
#cal{margin:0 0 6px}
.cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;text-transform:capitalize;font-size:18px;color:var(--skyInk);text-shadow:var(--skyShadow)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--skyMute);font-size:13px;text-shadow:var(--skyShadow)}
.dy{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);border-radius:11px;cursor:pointer;font-weight:600;padding:0}
.dy.td{border-color:var(--acc);border-width:2px}
.dy.sel{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.dy i{position:absolute;bottom:5px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--warn)}
.dy i.dn{background:var(--ok)}
.dy.sel i{background:var(--accInk)}
#dayh{margin:18px 0 8px;font-size:20px;font-weight:800;color:var(--skyInk);text-shadow:var(--skyShadow)}
.dg{margin:16px 0 6px;font-size:15px;font-weight:600;color:var(--skyMute);text-shadow:var(--skyShadow)}

/* elenco e scorrimento */
.sw{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden}
.sw .acts{position:absolute;top:0;right:0;bottom:0;width:0;display:flex;overflow:hidden}
.ab{flex:1 1 0;min-width:0;border:0;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;padding:0}
.ab.ed{background:var(--acc);color:var(--accInk)}
.ab.dl{background:var(--bad);color:#fff}
.card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-left:6px solid var(--acc);border-radius:16px;padding:14px;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:pointer;will-change:transform}
.card.late{border-left-color:var(--warn)}.card.done{border-left-color:var(--ok);opacity:.72}
.card.done .t{text-decoration:line-through}
.chk{width:26px;height:26px;accent-color:var(--ok);margin:2px 0 0;cursor:pointer}
.t{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.n{color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.due{font-size:14px;color:var(--mute);margin-top:2px}
.late .due{color:var(--warn);font-weight:600}
.bd{background:var(--warn);color:#1b1200;border-radius:6px;padding:0 6px;margin-left:6px;font-size:12px}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.th img,.ph{width:64px;height:64px;object-fit:cover;border-radius:8px}
.th img{cursor:zoom-in}
.ph{display:inline-block;background:var(--line)}
audio{width:100%;margin-top:8px;height:36px}
.empty{text-align:center;color:var(--skyMute);padding:34px 12px;text-shadow:var(--skyShadow)}

.sm{border:1px solid var(--line);background:var(--glass2);border-radius:10px;min-width:40px;height:38px;cursor:pointer;padding:0 12px}
.sm.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accInk);border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.35)}

/* finestre */
.ov{position:fixed;inset:0;background:rgba(5,8,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--glass2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet h3{margin:0 0 4px;font-size:17px}
#auth{z-index:20;align-items:center;background:rgba(5,8,20,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#auth .sheet,#usr .sheet{max-width:440px}
#auth .sheet{border-radius:20px;margin:0 16px}
#usr{z-index:12}
label{display:block;font-weight:600;margin:14px 0 4px}
label small{font-weight:400;color:var(--mute)}
input[type=text],input[type=email],input[type=password],textarea,input[type=datetime-local]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
::placeholder{color:var(--mute);opacity:.8}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:800}
.btn.out{border-color:var(--bad);color:#FF9A9A}
.am{min-height:1.4em;margin:10px 0 0;color:var(--mute)}
.ur{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 0;color:var(--mute)}
.ur b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.stack{display:grid;gap:8px;margin-top:14px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0 6px}
#att{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.at{position:relative}
.at img{width:76px;height:76px;object-fit:cover;border-radius:10px;display:block}
.at.au{flex:1 1 100%}
.at button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#F2F6FF;color:#0B1230;cursor:pointer}

/* nota a schermo intero */
.lg{display:inline-flex;border:1px solid rgba(255,255,255,.25);background:var(--glass2);border-radius:999px;padding:2px;cursor:pointer;color:#fff;font:700 12px/1 system-ui;align-items:center}
.lg span{padding:7px 9px;border-radius:999px;opacity:.65}
html[lang=en] .lg [data-l=en],html[lang=it] .lg [data-l=it]{background:#fff;color:#0B1230;opacity:1}
select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
select option{color:#0B1230}
.lock{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%)}
.lock.on{display:flex}.lock img{width:112px;height:112px;border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.lock h2{margin:0;font-size:28px;color:var(--skyInk);text-shadow:var(--skyShadow)}
.lock p{margin:0;max-width:320px;color:var(--skyInk);text-shadow:var(--skyShadow)}
.lk2{background:none;border:0;color:var(--skyInk);text-decoration:underline;cursor:pointer;padding:8px}
input[type=datetime-local]{display:block;min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;min-width:0}
.rl input{min-width:0}
.rl{display:flex;gap:8px;margin:0 0 8px}.rl input{flex:1}.rl .sm{flex:none}
.pbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0 6px}
.pbar i{height:14px;border-radius:4px;background:var(--field);border:1px solid var(--line)}
.pbar i.on{background:linear-gradient(180deg,#9db2ff,var(--acc));border-color:transparent}
.big2{font-size:22px;font-weight:800;margin:4px 0}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:rgba(255,255,255,.04)}
.box b{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.04)}
.kv b{display:block;font-size:22px}.kv span{font-size:13px;color:var(--mute)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--field);border:1px solid var(--line)}
.pill.ok{background:var(--ok);color:#06210f;border-color:transparent}.pill.wa{background:var(--warn);color:#1b1200;border-color:transparent}
.dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;text-align:center;margin-left:6px;padding:0 5px}
.cp{background:rgba(111,207,151,.15);border:1px solid var(--ok);border-radius:14px;padding:12px;margin:10px 0}
.code{font:700 20px/1.2 ui-monospace,monospace;letter-spacing:.04em;overflow-wrap:anywhere;margin:6px 0}
.lnk{width:100%;margin:6px 0}
.nv{position:fixed;inset:0;z-index:15;display:none;overflow:auto;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%)}
.nv.on{display:block}
.nvw{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.nvx{display:block;margin:0 0 10px auto}
.nvp{background:var(--glass2);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px}
.nvm img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:rgba(0,0,0,.28);margin:0 0 12px}
.nvm audio{width:100%;height:56px;margin:0 0 12px}
.nvm .ph{width:100%;height:200px;margin:0 0 12px;border-radius:14px}
#nvt{font-size:28px;font-weight:800;line-height:1.1;margin:6px 0 8px;overflow-wrap:anywhere;outline:none}
#nvd{font-size:18px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.big{width:100%;padding:16px;font-size:18px;margin-top:22px;border-radius:14px}
.big[disabled]{opacity:.6;cursor:default}

.alerts{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;z-index:25;display:grid;gap:8px;max-width:620px;margin:0 auto}
.al{background:var(--warn);color:#1b1200;border-radius:14px;padding:12px;display:grid;gap:8px;animation:pl 1s ease-in-out 3}
.al .lk{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:16px;color:#1b1200;cursor:pointer}
.al .sm{background:rgba(255,255,255,.7);border-color:transparent;color:#1b1200}
@keyframes pl{50%{transform:scale(1.025)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#F2F6FF;color:#0B1230;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90%}
#toast.on{display:block}
#lb{z-index:18;align-items:center}
#lb img{max-width:94%;max-height:90%;border-radius:10px;margin:auto}
</style></head>
<body class="guest">
<div id="sky" aria-hidden="true"><canvas id="stars"></canvas><canvas id="stars2"></canvas></div>

<div class="app">
  <div class="top">
    <div><h1 id="day"></h1><p class="sub" id="cnt"></p></div>
    <div class="hb">
      <button class="lg" id="lang" aria-label="Language"><span data-l="en">EN</span><span data-l="it">IT</span></button>
      <button class="ib" id="bell" aria-label="Attiva le notifiche">🔕</button>
      <button class="ib" id="ubtn" aria-label="Area utente">👤</button>
    </div>
  </div>
  <div class="tabs" id="views" role="group" aria-label="Vista">
    <button data-v="cal" aria-pressed="true" data-i="cal">Calendario</button>
    <button data-v="all" aria-pressed="false" data-i="all">Tutti gli impegni</button>
  </div>
  <div id="cal"></div>
  <h2 id="dayh"></h2>
  <div class="tabs" id="filters" role="group" aria-label="Filtro" hidden>
    <button data-f="all" aria-pressed="true" data-i="fAll">Tutti</button>
    <button data-f="todo" aria-pressed="false" data-i="fTodo">Da fare</button>
    <button data-f="done" aria-pressed="false" data-i="fDone">Fatti</button>
  </div>
  <div id="list"></div>
</div>
<button class="fab" id="add" data-i="add">+ Nuovo</button>

<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ft">
  <h2 id="ft">New task</h2>
  <label for="title" data-i="lTitle">Titolo</label><input type="text" id="title" maxlength="120" data-ph="phTitle" placeholder="Cosa devi fare?">
  <label for="note" data-i="lNote">Note</label><textarea id="note" data-ph="phNote" placeholder="Dettagli (facoltativo)"></textarea>
  <label for="due" data-i="lMain">Activity date and time</label>
  <input type="datetime-local" id="due">
  <label data-i="lDue">Reminders</label>
  <div id="rl"></div>
  <button type="button" class="btn" id="radd" data-i="radd">+ Add reminder</button>
  <label data-i="lAtt">Allegati</label>
  <div class="row">
    <button type="button" class="btn" id="bcam" data-i="bcam">📷 Scatta foto</button>
    <button type="button" class="btn" id="bgal" data-i="bgal">🖼️ Scegli immagini</button>
    <button type="button" class="btn" id="brec" data-i="brec">🎙️ Registra audio</button>
    <button type="button" class="btn" id="baud" data-i="baud">🎵 Carica audio</button>
  </div>
  <div id="att"></div>
  <div class="row" style="margin-top:20px;justify-content:flex-end">
    <button type="button" class="btn" id="cancel" data-i="cancel">Annulla</button>
    <button type="button" class="btn pri" id="ok" data-i="save">Salva</button>
  </div>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="gal" accept="image/*" multiple hidden>
  <input type="file" id="aud" accept="audio/*" hidden>
</div></div>

<div class="ov" id="usr"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ut">
  <h2 id="ut" data-i="uTitle">Area utente</h2>
  <div class="ur"><span data-i="uAcc">Account</span><b id="uem"></b></div>
  <div class="ur"><span data-i="uSt">Stato</span><b id="sy" role="status"></b></div>
  <div class="stack">
    <button type="button" class="btn" id="syn" data-i="syn">Sincronizza ora</button>
    <button type="button" class="btn" id="bioT" hidden></button>
    <button type="button" class="btn" id="rfb"><span data-i="rfb">Invite</span></button>
  </div>
  <div id="adm" hidden>
    <hr>
    <div class="stack" style="margin-top:0">
      <button type="button" class="btn" id="adb"><span data-i="adb">Referral &amp; Rewards</span><span class="dot" id="adn" hidden></span></button>
      <button type="button" class="btn" id="usb" data-i="usb">Users</button>
    </div>
    <hr>
    <h3 data-i="aNew">Nuovo account</h3>
    <p class="sub" data-i="aHint" style="margin:0 0 4px;color:#fff;text-shadow:none">Crea l’accesso per un’altra persona.</p>
    <label for="nem" data-i="aEm">Email della persona</label><input type="email" id="nem" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="email">
    <label for="nrf" data-i="nrfL">Referral program</label><select id="nrf"><option value="1" data-i="nrfOn">With referral</option><option value="0" data-i="nrfOff">Without referral</option></select>
    <label for="npw" data-i="aPw">Password</label><input type="text" id="npw" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn pri" id="mku" data-i="aMku">Create now</button>
      <button type="button" class="btn" id="nsd" data-i="aSend">Send code</button>
    </div>
    <div id="ncw" hidden>
      <label for="ncd" data-i="aCode">Code received by email</label><input type="text" id="ncd" inputmode="numeric" autocomplete="off" maxlength="6">
      <button type="button" class="btn" id="mk" style="margin-top:10px" data-i="aMk">Confirm and create</button>
    </div>
    <p class="am" id="amk" role="status" style="color:#fff"></p>
  </div>
  <hr>
  <div class="row" style="justify-content:space-between;margin-top:12px">
    <button type="button" class="btn out" id="out" data-i="out">Esci</button>
    <button type="button" class="btn" id="ucl" data-i="close">Chiudi</button>
  </div>
</div></div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lkt">
  <img src="icon-192.png" alt="">
  <h2 id="lkt">DayMarck</h2>
  <p data-i="lkH">Unlock with Face ID or fingerprint.</p>
  <button type="button" class="btn pri" id="unl" data-i="lkB" style="padding:13px 22px">Unlock</button>
  <p class="am" id="lkm" role="status"></p>
  <button type="button" class="lk2" id="unp" data-i="lkP">Use password instead</button>
</div>

<div class="ov" id="bio"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bit" style="max-width:440px">
  <h2 id="bit" data-i="bioT">Faster sign-in</h2>
  <p class="sub" data-i="bioH" style="color:#fff;text-shadow:none"></p>
  <div class="stack">
    <button type="button" class="btn pri" id="bioY" data-i="bioY">Enable</button>
    <button type="button" class="btn" id="bioN" data-i="bioN">Not now</button>
  </div>
  <p class="am" id="bim" role="status" style="color:#fff"></p>
</div></div>

/* ---------- cielo che cambia durante la giornata ---------- */
const SKY=[
  [0,'#050a1c','#0b1636','#16224a',1],
  [5,'#0a1330','#1d2c5c','#3b3f73',.8],
  [6.5,'#2c3e78','#e0829a','#ffc27a',.15],
  [8.5,'#4aa3e0','#8ccaf0','#cfeaf7',0],
  [13,'#2f8fe0','#6db8ee','#bfe3f7',0],
  [17,'#4a8fd8','#a9c9e8','#f6d9a6',0],
  [18.75,'#2d3a7c','#d9708a','#ffb36b',.2],
  [20,'#121c4a','#38336e','#7a4a7a',.7],
  [21.5,'#060c24','#0e1a3d','#1a2652',1],
  [24,'#050a1c','#0b1636','#16224a',1]
];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
const rgb=a=>'rgb('+a.join(',')+')';
const toHex=a=>'#'+a.map(v=>p2(v.toString(16))).join('');
const lum=a=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(a[0])+.7152*f(a[1])+.0722*f(a[2])};
function skyAt(h){
  let i=0;while(i<SKY.length-2&&h>=SKY[i+1][0])i++;
  const A=SKY[i],B=SKY[i+1],t=Math.min(1,Math.max(0,(h-A[0])/(B[0]-A[0])));
  return{c:[1,2,3].map(k=>mix(hex(A[k]),hex(B[k]),t)),s:A[4]+(B[4]-A[4])*t};
}
// Testo chiaro o scuro, a seconda di cosa si legge meglio sulla parte alta del cielo.
function skyInk(c){
  // Si valutano più punti della zona del titolo e vince il testo che nel punto peggiore si legge meglio.
  const darkL=lum([11,18,48]);let wl=99,wd=99;
  for(const t of [0,.2,.35,.5]){
    const L=lum(mix(c[0],c[1],t));
    wl=Math.min(wl,1.05/(L+.05));wd=Math.min(wd,(L+.05)/(darkL+.05));
  }
  return wl>=wd?'light':'dark';
}
function applySky(date){
  const n=date||new Date(),h=n.getHours()+n.getMinutes()/60,{c,s}=skyAt(h),st=document.documentElement.style;
  st.setProperty('--sky1',rgb(c[0]));st.setProperty('--sky2',rgb(c[1]));st.setProperty('--sky3',rgb(c[2]));
  st.setProperty('--stars',s.toFixed(2));
  const light=skyInk(c)==='light';
  st.setProperty('--skyInk',light?'#F2F6FF':'#0B1230');
  st.setProperty('--skyMute',light?'rgba(242,246,255,.86)':'rgba(11,18,48,.8)');
  st.setProperty('--skyShadow',light?'0 1px 10px rgba(0,0,0,.4)':'0 1px 10px rgba(255,255,255,.45)');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',toHex(c[0]));
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawStars(){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=window.innerWidth,h=window.innerHeight;
  [['stars',7,1],['stars2',23,.28]].forEach(([id,seed,share])=>{

/* ---------- stato ---------- */
let user=null,items=[],tomb=[],view='cal',filter='all',cur=new Date(),sel=todayKey(),draft=null,mr=null,rt=null,actx=null;
let syncing=false,again=false,synced=false,started=false,pendingNote=null,pendingKind=null,nvId=null,nvKind=null;
const KEYU=()=>'promemoria.v2.'+user.id;

/* ---------- salvataggio locale ---------- */
const strip=t=>({...t,imgs:t.imgs.map(a=>a.path?{path:a.path}:a),audio:t.audio?(t.audio.path?{path:t.audio.path}:t.audio):null});
function persist(){
  if(!user)return;
  try{localStorage.setItem(KEYU(),JSON.stringify({items:items.map(strip),tomb}))}
  catch(e){toast(t_('full'))}
}
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem(KEYU())||'{}');items=(d.items||[]).map(t=>{t={imgs:[],audio:null,srv:[],...t};if(!t.alerts)t.alerts=t.due?[{id:uuid(),at:t.due,sent:!!t.alerted,srv:false,kind:'main'}]:[];if(t.alerts.length&&!t.alerts.some(a=>a.kind)){t.alerts.sort((x,y)=>x.at<y.at?-1:1);t.alerts.forEach((a,i)=>a.kind=i?'remind':'main')}return t});tomb=d.tomb||[]}
  catch(e){items=[];tomb=[]}
}
const sig=()=>JSON.stringify(items.map(strip));
function commit(){persist();render();sync()}

/* ---------- allegati ---------- */
const blobs=new Map(),loading=new Set();
async function hydrate(t){
  if(!sb)return;
  for(const a of [...t.imgs,...(t.audio?[t.audio]:[])]){
    if(!a.path||a.url)continue;
    if(blobs.has(a.path)){a.url=blobs.get(a.path);continue}
    if(loading.has(a.path))continue;
    loading.add(a.path);
    try{
      const {data,error}=await sb.storage.from('attachments').download(a.path);
      if(error)throw error;
      const u=URL.createObjectURL(data);blobs.set(a.path,u);a.url=u;render();if(nvId===t.id)renderNote();
    }catch(e){/* offline: riprova alla prossima sincronizzazione */}
    finally{loading.delete(a.path)}
  }
}
async function upload(t,a){
  const blob=await (await fetch(a.url)).blob(),ty=blob.type||'';
  const ext=ty.includes('webm')?'webm':ty.includes('mp4')||ty.includes('aac')?'m4a':ty.includes('mpeg')?'mp3':ty.includes('ogg')?'ogg':ty.includes('jpeg')?'jpg':'bin';
  const path=user.id+'/'+t.id+'/'+uid()+'.'+ext;
  const {error}=await sb.storage.from('attachments').upload(path,blob,{contentType:ty||'application/octet-stream',upsert:false});
  if(error)throw error;
  return path;
}

/* ---------- sincronizzazione ---------- */
const mainOf=t=>(t.alerts||[]).find(a=>a.kind==='main');
const remOf=t=>(t.alerts||[]).filter(a=>a.kind!=='main');
const firstAt=t=>{const m=mainOf(t);return m?m.at:(t.alerts&&t.alerts.length?t.alerts.map(a=>a.at).sort()[0]:'')};
const lastAt=t=>t.alerts&&t.alerts.length?t.alerts.map(a=>a.at).sort().slice(-1)[0]:(t.due||'');
const snap=t=>JSON.stringify([rowOf(t),t.alerts.map(a=>[a.id,a.at,a.sent,a.kind])]);
function fromRow(r,local,al){
  const old=new Map((local?[...local.imgs,...(local.audio?[local.audio]:[])]:[]).filter(a=>a.path).map(a=>[a.path,a.url]));
  const mk=p=>({path:p,url:old.get(p)||blobs.get(p)||''});
  const ip=r.img_paths||[];
  const alerts=(al||[]).map(a=>{const at=loc(new Date(a.at));return{id:a.id,at,sent:a.sent,kind:a.kind||'remind',srv:true,atSrv:at,sentSrv:a.sent}}).sort((x,y)=>x.at<y.at?-1:1);
  return{id:r.id,title:r.title,note:r.note||'',due:(alerts.find(a=>a.kind==='main')||alerts[0]||{}).at||(r.due?loc(new Date(r.due)):''),done:r.done,alerts,
    imgs:ip.map(mk),audio:r.audio_path?mk(r.audio_path):null,dirty:false,srv:[...ip,...(r.audio_path?[r.audio_path]:[])]};
}
const rowOf=t=>({id:t.id,title:t.title,note:t.note||'',due:firstAt(t)?new Date(firstAt(t)).toISOString():null,done:!!t.done,alerted:true,
  img_paths:t.imgs.map(a=>a.path).filter(Boolean),audio_path:t.audio&&t.audio.path?t.audio.path:null});
async function sync(){
  if(!sb||!user)return;
  if(syncing){again=true;return}
  syncing=true;setSync('syncing');
  try{
    for(const g of [...tomb]){
      const {error}=await sb.from('reminders').delete().eq('id',g.id);
      if(error)throw error;
      if(g.paths&&g.paths.length)await sb.storage.from('attachments').remove(g.paths);
      tomb=tomb.filter(x=>x.id!==g.id);persist();
    }
    for(const t of items.filter(x=>x.dirty)){
      for(const a of [...t.imgs,...(t.audio?[t.audio]:[])]){if(!a.path&&a.url)a.path=await upload(t,a)}
      t.due=firstAt(t);
      const row=rowOf(t),sent=snap(t);
      const {error}=await sb.from('reminders').upsert(row,{onConflict:'id'});
      if(error)throw error;
      const wr=t.alerts.filter(a=>!a.srv||a.at!==a.atSrv||(a.sent&&!a.sentSrv)).map(a=>({a,at:a.at,sent:a.sent}));
      if(wr.length){
        const {error:e2}=await sb.from('reminder_alerts').upsert(wr.map(w=>({id:w.a.id,reminder_id:t.id,at:new Date(w.at).toISOString(),sent:w.sent,kind:w.a.kind==='main'?'main':'remind'})),{onConflict:'id'});
        if(e2)throw e2;
      }
      {const ids=t.alerts.map(a=>a.id);
        const q=sb.from('reminder_alerts').delete().eq('reminder_id',t.id);
        const {error:e3}=await (ids.length?q.not('id','in','('+ids.join(',')+')'):q);
        if(e3)throw e3;}
      wr.forEach(w=>{w.a.srv=true;w.a.atSrv=w.at;w.a.sentSrv=w.sent});
      const keep=new Set([...row.img_paths,...(row.audio_path?[row.audio_path]:[])]);
      const gone=(t.srv||[]).filter(p=>!keep.has(p));
      if(gone.length)await sb.storage.from('attachments').remove(gone);
      t.srv=[...keep];
      t.dirty=snap(t)!==sent;   // se è cambiato durante l'invio, resta da sincronizzare
      persist();
    }
    const {data,error}=await sb.from('reminders').select('*');
    if(error)throw error;
    const {data:ald,error:ae}=await sb.from('reminder_alerts').select('id,reminder_id,at,sent,kind');
    if(ae)throw ae;
    const byR={};ald.forEach(a=>(byR[a.reminder_id]=byR[a.reminder_id]||[]).push(a));
    const before=sig(),ids=new Set(data.map(r=>r.id));
    for(const r of data){
      const local=items.find(x=>x.id===r.id);
      if(local&&local.dirty)continue;
      const n=fromRow(r,local,byR[r.id]);
      if(local)Object.assign(local,n);else items.push(n);
    }
    items=items.filter(t=>t.dirty||ids.has(t.id));
    synced=true;persist();
    if(sig()!==before){render();if(nvId)renderNote()}
    items.forEach(hydrate);
    setSync('synced');
  }catch(e){
    console.warn('sync',e);
    setSync(navigator.onLine?'syncFail':'offline');
  }finally{
    syncing=false;
    if(again){again=false;sync()}
  }
}

/* ---------- scorrimento a sinistra: Modifica / Elimina ---------- */
const AW=170;let drag=null,openSw=null,lastDrag=0;
function setX(sw,x,anim){
  const c=sw.querySelector('.card'),a=sw.querySelector('.acts');
  c.style.transition=anim?'transform .2s ease':'none';
  c.style.transform=x?`translateX(${x}px)`:'';
  a.style.transition=anim?'width .2s ease':'none';
  a.style.width=Math.max(0,-x)+'px';
}
function closeSw(){if(openSw){setX(openSw,0,true);openSw=null}}
$('#list').addEventListener('pointerdown',e=>{
  const sw=e.target.closest('.sw');
  if(!sw){closeSw();return}
  if(e.target.closest('audio,input,.ab'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(openSw&&openSw!==sw)closeSw();
  drag={sw,x0:e.clientX,y0:e.clientY,base:sw===openSw?-AW:0,on:false,id:e.pointerId,x:null};
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.on){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4){drag.on=true;try{drag.sw.setPointerCapture(e.pointerId)}catch(_){}}
    else if(Math.abs(dy)>10){drag=null;return}
    else return;
  }
  drag.x=Math.max(-AW,Math.min(0,drag.base+dx));
  setX(drag.sw,drag.x,false);
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!d.on)return;
  lastDrag=Date.now();
  const open=(d.x===null?d.base:d.x)<-AW/2;
  setX(d.sw,open?-AW:0,true);openSw=open?d.sw:null;
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);

$('#list').addEventListener('click',e=>{
  if(Date.now()-lastDrag<350)return;
  const sw=e.target.closest('.sw');if(!sw)return;
  const t=items.find(x=>x.id===sw.dataset.id);if(!t)return;
  const b=e.target.closest('[data-a]'),a=b&&b.dataset.a;
  if(a==='chk'){t.done=b.checked;t.dirty=true;commit();return}
  if(a==='edit'){closeSw();openF(t);return}
  if(a==='del'){
    if(b.dataset.arm){
      items=items.filter(x=>x!==t);
      tomb.push({id:t.id,paths:[...(t.srv||[])]});
      commit();toast(t_('delToast'));
    }else{b.dataset.arm=1;b.textContent=t_('sure');setTimeout(()=>{if(b.isConnected&&b.dataset.arm){b.dataset.arm='';b.textContent=t_('del')}},3000)}
    return;
  }
  if(a==='img'){const im=t.imgs[+b.dataset.i];if(im&&im.url){$('#lbimg').src=im.url;$('#lb').classList.add('on')}return}
  if(e.target.closest('audio'))return;
  if(openSw){closeSw();return}
  openNote(t.id);
});

function beep(){
  if(!actx)return;
  [0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+d;o.frequency.value=880;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.3)});
}
let curAudio=null;

function playAtt(t){ // solo per la notifica dell'attività: dopo il suono parte la registrazione allegata
  if(!t.audio)return;
  hydrate(t).then(()=>{
    if(!t.audio||!t.audio.url||nvId===t.id)return;
    stopAudio();const a=new Audio(t.audio.url);curAudio=a;a.play().catch(()=>{});

}
function fire(t,a){
  beep();if(!a||a.kind==='main')setTimeout(()=>playAtt(t),1300);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  const el=document.createElement('div');el.className='al';el.dataset.id=t.id;if(a)el.dataset.aid=a.id;
  const main=!a||a.kind==='main';el.dataset.kind=main?'main':'remind';

  $('#alerts').append(el);
  try{if('Notification' in window&&Notification.permission==='granted'){
    const o={body:t.title,tag:t.id,icon:'icon-192.png',data:{id:t.id,kind:main?'main':'remind'}},sw=navigator.serviceWorker;
    (sw?sw.getRegistration():Promise.resolve()).then(r=>r?r.showNotification('DayMarck',o):new Notification('DayMarck',o)).catch(()=>{});
  }}catch(e){}
}

const b64u=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function getSub(){const r=await navigator.serviceWorker.getRegistration();return r?r.pushManager.getSubscription():null}
async function bellState(){
  let on=false;
  try{on=pushOK()&&Notification.permission==='granted'&&!!(await getSub())}catch(e){}
  $('#bell').textContent=on?'🔔':'🔕';
  $('#bell').setAttribute('aria-label',on?t_('bellOn'):t_('bellOff'));
  return on;
}
async function subscribePush(){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
  const j=sub.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
  if(error)throw error;
  return reg;
}
$('#bell').onclick=async()=>{

  try{
    if(Notification.permission!=='granted'){
      const r=await Notification.requestPermission();
      if(r!=='granted'){toast(t_('pushDenied'));return}
    }
    const reg=await subscribePush();
    await bellState();
    reg.showNotification('DayMarck',{body:t_('pushTest'),tag:'prova',icon:'icon-192.png'});
  }catch(e){console.warn(e);toast(t_('pushFail'))}
};
async function ensurePush(){
  try{if(pushOK()&&Notification.permission==='granted')await subscribePush()}catch(e){console.warn('push',e)}
  bellState();
}

  try{const r=new URLSearchParams(location.search).get('ref');if(r&&/^[A-Za-z0-9]{4,16}$/.test(r)){localStorage.setItem('dm.ref',r.toUpperCase());const u=new URL(location.href);u.searchParams.delete('ref');history.replaceState(null,'',u.pathname+u.search)}}catch(e){}
})();
async function claimRef(){
  try{const c=localStorage.getItem('dm.ref');if(!c||!sb)return;
    const {data,error}=await sb.rpc('claim_referral',{p_code:c});
    if(!error)localStorage.removeItem('dm.ref');
  }catch(e){}
}

/* ---------- Face ID / impronta: blocco locale dell'app (WebAuthn, solo sul dispositivo) ---------- */
let bioOK=false,fresh=false,unlocked=false,hiddenAt=0;
const bk=()=>user?'dm.bio.'+user.id:null;
const bioGet=()=>{try{return localStorage.getItem(bk())}catch(e){return null}};
const toB=u8=>btoa(String.fromCharCode(...new Uint8Array(u8))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function bioProbe(){
  try{bioOK=!!(window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){bioOK=false}
  bioBtn();
}
function bioBtn(){const b=$('#bioT');b.hidden=!bioOK;b.textContent=t_(bioGet()?'bioOn':'bioOff')}
async function bioEnable(){
  const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'DayMarck',id:location.hostname},
    user:{id:new TextEncoder().encode(user.id),name:user.email,displayName:user.email},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  if(!cred)throw new Error('none');
  localStorage.setItem(bk(),toB(cred.rawId));unlocked=true;bioBtn();
}
async function bioVerify(){
  const id=bioGet();if(!id)return true;
  const raw=Uint8Array.from(atob(id.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:raw,transports:['internal']}],userVerification:'required',timeout:60000}});
  return !!a;
}
function showLock(){$('#lock').classList.add('on');$('#lkm').textContent='';tryUnlock()}
async function tryUnlock(){
  try{if(await bioVerify()){unlocked=true;$('#lock').classList.remove('on')}}
  catch(e){$('#lkm').textContent=t_('bioErr')}
}
$('#unl').onclick=tryUnlock;
$('#unp').onclick=async()=>{try{localStorage.removeItem(bk())}catch(e){}$('#lock').classList.remove('on');unlocked=true;try{await sb.auth.signOut()}catch(e){}};
function bioGate(){ // all'apertura: se Face ID è attivo, l'app resta coperta finché non si sblocca
  if(bioGet()&&!unlocked&&!fresh){$('#lock').classList.add('on');showLock()}
}
async function offerBio(){
  await bioProbe();
  let no=false;try{no=!!localStorage.getItem('dm.bio.no.'+user.id)}catch(e){}
  if(bioOK&&!bioGet()&&!no)$('#bio').classList.add('on');
}
$('#bioY').onclick=async()=>{
  try{await bioEnable();$('#bio').classList.remove('on');toast(t_('bioOk'))}
  catch(e){$('#bim').textContent=t_('bioErr')}
};
$('#bioN').onclick=()=>{try{localStorage.setItem('dm.bio.no.'+user.id,'1')}catch(e){}$('#bio').classList.remove('on')};
$('#bioT').onclick=async()=>{
  if(bioGet()){try{localStorage.removeItem(bk())}catch(e){}bioBtn();return}
  try{await bioEnable();toast(t_('bioOk'))}catch(e){toast(t_('bioErr'))}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(user&&bioGet()&&hiddenAt&&Date.now()-hiddenAt>60000){unlocked=false;showLock()}
});

/* ---------- accesso ---------- */
const amsg=m=>{$('#am').textContent=m};
function showAuth(m){document.body.classList.add('guest');$('#auth').classList.add('on');amsg(m||'')}
function errIt(e){
  const m=String(e&&e.message||e);
  if(/invalid login/i.test(m))return t_('lgBad');
  if(/not confirmed/i.test(m))return t_('lgConf');
  if(/rate limit|too many/i.test(m))return t_('lgRate');
  if(/network|fetch/i.test(m))return t_('lgNo');
  return t_('lgFail')+m;
}
async function doLogin(){
  if(!sb){amsg(t_('lgNet'));return}
  const email=$('#em').value.trim(),password=$('#pw').value;
  if(!email||!password){amsg(t_('lgNeed'));return}
  amsg(t_('lgWait'));
  try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;fresh=true;amsg('')}
  catch(e){amsg(errIt(e))}
}
$('#login').onclick=doLogin;
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

$('#out').onclick=async()=>{
  await sync();
  if(items.some(t=>t.dirty)&&!confirm(t_('leave')))return;
  try{const s=await getSub();if(s){await sb.from('push_subscriptions').delete().eq('endpoint',s.endpoint);await s.unsubscribe()}}catch(e){}
  try{localStorage.removeItem(KEYU());localStorage.removeItem(bk())}catch(e){}
  $('#usr').classList.remove('on');
  await sb.auth.signOut();
};

async function start(u){
  user=u;synced=false;loadLocal();bioGate();bioProbe();
  document.body.classList.remove('guest');$('#auth').classList.remove('on');
  render();items.forEach(hydrate);
  await sync();ensurePush();check();claimRef();pendingBadge();flags();
  if(fresh){fresh=false;unlocked=true;offerBio()}
  if(pendingNote)openNote(pendingNote,pendingKind||'remind');
  if(!started){
    started=true;
    setInterval(check,15000);
    setInterval(()=>{if(!document.hidden)sync()},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){applySky();sync().then(check)}});
    addEventListener('online',sync);
  }
}
if(sb){
  sb.auth.onAuthStateChange((ev,s)=>{
    const u=s&&s.user;
    if(u&&(!user||user.id!==u.id))setTimeout(()=>start(u),0);
    else if(!u&&(ev==='SIGNED_OUT'||ev==='INITIAL_SESSION')){
      if(ev==='SIGNED_OUT'){user=null;unlocked=false;items=[];tomb=[];synced=false;closeNote();render();setSync('')}
      showAuth();
    }
  });
}else showAuth(t_('lgNet'));

/* ---------- avvio ---------- */
(function(){
  const q=new URLSearchParams(location.search).get('note');
  if(q){pendingNote=q;pendingKind=new URLSearchParams(location.search).get('k');try{history.replaceState(null,'',location.pathname)}catch(e){}}

$('#lang').onclick=()=>{
  LANG=LANG==='en'?'it':'en';
  try{localStorage.setItem('dm.lang',LANG)}catch(e){}
  applyLang();setSync(syncKey);bellState();render();if(nvId)renderNote();if($('#rf').classList.contains('on')&&RF)renderRef();
};
if(navigator.standalone)document.documentElement.classList.add('ios-sa');
applyLang();
applySky();drawStars();setInterval(()=>applySky(),60000);
render();
